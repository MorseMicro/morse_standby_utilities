#
# This file is used as input to the "morse_standby_daemon.sh" utility script.

# Whether to print to stdout/stderr instead of the system log.
#
# Set to false when running as a daemon so that log messages are directed to the console.
#
# Default: false
#foreground=true

# Whether to enable verbose output.
#
# Default: false
#verbose=true

# Whether to print device configuration information.
#
# Default: false
#config_report=true

# Wi-Fi interface.
#
# Default: wlan0
#interface=wlan0

# Interval in seconds with no activity on the interface before entering standby mode.
#
# Default: 15
#poll_period=15

# Configuration file to be used for the 'morse_cli standby config <config file>" command.
#
# Path is relative to this config file.
#
# Default: standby.conf
#standby_config_file=standby.conf

# SSID to scan for when not associated.
#
# Use this to allow the host to shut down or hibernate even when the AP is down, not configured,
# or out of range.
#
# If not configured:
# - The device will not enter standby mode until it has associated.
# - If association is lost while in standby mode, the device will exit standby mode immediately.
#
# If configured:
# - The device will enter standby mode if it is not able to associate with an AP within
#   not_assoc_poll_periods periods (see below).
# - If the device has entered standby while not associated, it will exit standby when periodic
#   scans detect beacons for this SSID.
# - If association is lost while in standby mode, the chip will scan periodically and only exit
#   standby mode when beacons from the AP are detected.
#
# The value can be a quoted text string or an unquoted hex string (no prefix). Use a hex string
# if the SSID contains special characters, such as '#', or non-display characters.
# E.g. These are identical:
#   ssid="test123"
#   ssid=746573743132330a
#
# Default: none
#scan_ssid=

# Number of poll periods to wait before entering standby mode when not associated.
#
# Requires scan_ssid to be set.
#
# Default: 4
#not_assoc_poll_periods=4

# Whether to save and restore ARP entries when entering and exiting standby mode.
#
# This can reduce ARP discovery exchanges after exiting standby, but requires writing config to
# flash before entering standby.
#
# Default: true
#save_arp_entries=true

# Whether to save and restore DHCP entries when entering and exiting standby mode.
#
# This can reduce DHCP discovery exchanges after exiting standby, but requires writing config to
# flash before entering standby (if not using FullMAC, which can obtain DHCP config from the chip).
#
# Default: true
#save_dhcp_entries=true

### TEST MODE CONFIGURATION ###

# Wake monitor test script - requires a wake pin connected from the chip to the host device.
#
# Use this to verify that standby mode works as expected. Set to an empty string to disable.
#
# This script should:
# 1) Emulate host shutdown or hibernation, for example, by killing wpa_supplicant and unloading
#    the morse.ko driver.
# 1) Request the GPIO wake pin through the GPIO character device API, so it can be monitored.
# 2) Wait for the chip to toggle the GPIO wake pin.
# 3) Emulate a host restart, for example, by reloading the morse.ko driver and wpa_supplicant.
#
# If configured, the host device will not be shut down when entering standby.
#
# Path is relative to the location of the standby daemon script.
#
# Default: none
# Use ./morse_standby_wake_monitor.sh to enable test mode using the supplied sample monitor script.
#wake_monitor_test_script=./morse_standby_wake_monitor.sh

# Host device GPIO pin that is connected to the chip's host wake pin
#
# Not used if the wake monitor test script is not set.
#
# MMECH06: use 12 and set host_power_on_pin in standby_config_file to 2.
# MMECH17: use 12 and set host_power_on_pin in standby_config_file to 1.
#
# Default: 12
#wake_monitor_gpio=12

# GPIO pin debounce period (milliseconds) for the wake monitor test script.
#
# Not used if the wake monitor test script is not set.
#
# Default: 1000
#wake_monitor_debounce_ms=1000
