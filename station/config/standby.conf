### GPIO PIN CONFIGURATION ###

# Chip GPIO pin to be toggled to turn the host device off (e.g. via an MCU).
#
# Default: -1 (not configured)
#host_power_off_pin=-1

# Duration (milliseconds) of the pulse the chip produces to turn the host device off.
#
# Default: 50
#host_power_off_pulse_ms=50

# Chip GPIO pin to be toggled to turn the host device on (e.g. via an MCU).
#
# Default: -1 (not configured)
#host_power_on_pin=-1

# Duration (milliseconds) of the pulse the chip produces to turn the host device on.
#
# Default: 50
#host_power_on_pulse_ms=50


### STANDBY STATUS NOTIFICATION CONFIGURATION ###

# Status notification (UDP) packets can be monitored by the AP or an upstream device,
# to keep track of the reachability and standby status (awake or asleep) of this device.

# Period (seconds) for transmitting standby status notification packets.
#
# - Use 0 to send standby status notification packets only on state change (wake or sleep).
# - Use -1 to disable standby status notification packets.
#
# Note: Periodic Standby status notifications will prevent the AP's ARP entry from ageing out,
# resulting in faster response to wake packets.
#
# Default: 15
notify_period_s=15

# IP address of this device, for use in standby status notification packets.
#
# - If not configured, the chip will use the value configured by DHCP (if present).
# - If a static IP address is used, this value should be set to match.
#
# If not configured here and not obtained by the chip, status notification packets will not be sent.
#
# Default: 0.0.0.0 (not configured)
src_ip=0.0.0.0

# IP address of the device used for monitoring station standby status.
#
# If not configured here and not obtained by the chip, status notification packets will not be sent.
#
# Default: 0.0.0.0 (not configured)
dest_ip=0.0.0.0

# UDP port for use in standby status notification packets.
#
# Default: 22000
dest_port=22000


### WAKE PACKET CONFIGURATION ###

# Wake packets can be sent by the AP or an upstream device to wake this station when it is
# in standby.

# Standby wake packet payload pattern to match. The value is arbitrary, but must match the value
# used in the standby wake packets.
#
# Default: 0x0CBF740102
# - Morse Micro OUI (0x0CBF74)
# - standby frame type (0x01)
# - standby frame 'wake' subtype (0x02)
wake_packet_filter=0CBF740102

# Offset from the start of the payload to check for the wake_packet_filter value.
#
# Default: 0
wake_packet_filter_offset=0

# Whether to send a protected disassociation frame (best effort) to the AP when exiting standby.
# This prevents the AP from initiating an SA query exchange when the station reconnects to the BSS.
#
# Default: 0
#disassoc_on_wake=0


### DEEP SLEEP CONFIGURATION ###

# Deep sleep can be used to reduce power consumption, at the cost of response time.

# Number of seconds for the firmware to wait after beacon loss before entering deep sleep.
#
# Default: 60
bss_inactivity_before_deep_sleep_s=60

# Duration (seconds) for firmware to remain in deep sleep.
#
# Default: 30
deep_sleep_period_s=30

# Number of deep sleep iterations between each scan.
#
# Default: 4
deep_sleep_scan_iterations=4
